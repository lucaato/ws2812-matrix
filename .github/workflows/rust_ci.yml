name: CI

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host-checks:
    name: Core and emulator (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: >
          cargo clippy -p ws2812-matrix-core -p ws2812-matrix-emulator
          -- -D warnings
      - name: Build emulator
        run: cargo build -p ws2812-matrix-emulator --release
      - name: Test core
        run: cargo test -p ws2812-matrix-core

  firmware-checks:
    name: Firmware (riscv32imc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: riscv32imc-unknown-none-elf
          components: rust-src, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy -- -D warnings
