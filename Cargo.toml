[workspace]
resolver = "2"
members = ["core", "firmware", "emulator"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lucaato/ws2812-matrix"
authors = ["Luca Arato <luca.arato.work@gmail.com>"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
debug-assertions = false
incremental   = false
lto           = "fat"
opt-level     = "s"
overflow-checks = false
